services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      SCNA_ENV: production
      SCNA_CORS_ORIGINS: ${SCNA_CORS_ORIGINS}
    volumes:
      - paper_uploads:/app/uploads
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY}
        VITE_CAPTCHA_MODE: ${CAPTCHA_MODE}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  paper_uploads:
