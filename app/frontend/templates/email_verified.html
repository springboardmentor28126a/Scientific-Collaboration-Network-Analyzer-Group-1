<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .verification-card {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .login-button {
            display: inline-block;
            padding: 12px 25px;
            text-decoration: none;
            color: white;
            background: #2563eb;
            border-radius: 6px;
            font-weight: bold;
        }

        .login-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="verification-card">

        <div class="success-icon">✅</div>

        <h1>Email Verified Successfully!</h1>

        <p>
            Your email address has been successfully verified.
            You can now log in to your SCNA account.
        </p>

        <a href="/login" class="login-button">
            Go to Login
        </a>

    </div>

</body>
</html>
