<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if title %}
      <title>SCNA - {{ title }}</title>
    {% else %}
      <title>Scientific Collaboration Network Analyzer</title>
    {% endif %}
    <meta name="description" content="Scientific Collaboration Network Analyzer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}" sizes="any">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-nav sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="{{ url_for('home_page') }}">SCNA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav me-auto">
            <a class="nav-link" href="{{ url_for('dashboard_page') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('researchers_page') }}">Researchers</a>
            <a class="nav-link" href="{{ url_for('publications_page') }}">Publications</a>
            <a class="nav-link" href="{{ url_for('collaborations_page') }}">Collaborations</a>
            <a class="nav-link" href="{{ url_for('reports_page') }}">Reports</a>
          </div>
          <div class="navbar-nav align-items-lg-center gap-2">
            <!-- <span class="nav-user" id="navUser">Guest</span> -->
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('login_page') }}" id="loginLink">Login</a>
            <a class="btn btn-sm btn-light" href="{{ url_for('register_page') }}" id="registerLink">Register</a>
            <button class="btn btn-sm btn-outline-light d-none" id="logoutBtn" type="button">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock content %}
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto" id="toastTitle">SCNA</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
