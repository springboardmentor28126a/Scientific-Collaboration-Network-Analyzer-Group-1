{% extends "layout.html" %}

{% block content %}
  <section class="auth-page">
    <form class="auth-card" id="loginForm">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <label>Email</label>
      <input name="email" type="email" required>
      <label>Password</label>
      <input name="password" type="password" required>
      <button type="submit">Login</button>
      <p class="subtle">New user? <a href="{{ url_for('register_page') }}">Create an account</a>.</p>
    </form>
  </section>
{% endblock content %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', path='js/auth-page.js') }}"></script>
{% endblock scripts %}
